<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>山音文学地图</title>
    <script type="module" crossorigin src="/novel-map/assets/index-DYovYgvV.js"></script>
    <link rel="stylesheet" crossorigin href="/novel-map/assets/index-RzuAk-f7.css">
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="sidebar-header">
          <h1>山音文学地图</h1>
          <p class="subtitle">川端康成《山音》中的地点</p>
          <div class="view-presets">
            <button id="view-all" type="button">全部地点</button>
            <button id="view-home" type="button">家附近</button>
            <button id="view-commute" type="button">通勤路线</button>
          </div>
          <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true">
            收起清单 ▴
          </button>
        </header>
        <nav id="location-list" aria-label="地点清单"></nav>
      </aside>
      <main id="map-container">
        <div id="map"></div>
        <div id="map-loading" aria-hidden="true"></div>
        <nav id="timeline" aria-label="故事时间线"></nav>
        <section id="detail-panel" class="hidden" aria-label="地点详情"></section>
      </main>
    </div>
  </body>
</html>
